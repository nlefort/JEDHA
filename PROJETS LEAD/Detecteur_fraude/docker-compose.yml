version: '3.9'

services:
  # Base de données pour Airflow
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data

  # Airflow (Webserver & Scheduler réunis )
  airflow:
    build: 
      context: .
      dockerfile: docker/Dockerfile.airflow
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - shared_data:/app/data # volume partagé avec l'API
    command: standalone # Lance webserver + scheduler

  # API de paiement
  api:
    build: 
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - shared_data:/app/data
    depends_on:
      - airflow-db

  # MLflow UI
  mlflow_ui:
    build:
        context: .
        dockerfile: docker/Dockerfile.mlflow
    ports:
        - "5000:5000"
    volumes:
        - ./mlruns:/app/mlruns

volumes:
  airflow_db_data:
  shared_data: