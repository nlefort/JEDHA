version: '3.9'

services:
  # Base de données pour Airflow
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data

  # Airflow (Webserver & Scheduler réunis par simplification de lecture)
  airflow:
    image: apache/airflow:2.7.1
    depends_on:
      - airflow-db
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - shared_data:/app/data # Volume partagé pour la DB SQLite finale
    command: standalone # Mode simplifié pour dev : lance tout (webserver + scheduler)

  # API de paiement
  api:
    build: 
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - shared_data:/app/data

  # MLflow UI
  mlflow_ui:
    image: ghcr.io/mlflow/mlflow
    ports:
      - "5000:5000"
    command: mlflow ui --host 0.0.0.0

volumes:
  airflow_db_data:
  shared_data: